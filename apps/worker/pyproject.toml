[project]
name = "asor-worker"
version = "0.2.0"
description = "asor task consumer that spawns Gemini CLI runner containers"
requires-python = ">=3.11"
dependencies = [
    "asor-core",
    "aio-pika>=9.4",
    "docker>=7.1",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asor_worker"]
