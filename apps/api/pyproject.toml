[project]
name = "asor-api"
version = "0.1.0"
description = "asor orchestrator HTTP API"
requires-python = ">=3.11"
dependencies = [
    "asor-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "docker>=7.1",
    "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asor_api"]
