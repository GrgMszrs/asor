name: asor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asor
      POSTGRES_PASSWORD: asor
      POSTGRES_DB: asor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asor"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: asor
      RABBITMQ_DEFAULT_PASS: asor
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12

  agent-runner-build:
    image: asor-agent-runner:dev
    build:
      context: ../../apps/agent-runner
      dockerfile: Dockerfile
    command: ["true"]
    profiles: ["build-only"]

  api:
    image: asor-api:dev
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      ASOR_AMQP_URL: amqp://asor:asor@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://asor:asor@postgres:5432/asor
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: asor-worker:dev
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      ASOR_AMQP_URL: amqp://asor:asor@rabbitmq:5672/
      ASOR_AGENT_RUNNER_IMAGE: ${ASOR_AGENT_RUNNER_IMAGE:-asor-agent-runner:dev}
      ASOR_RUNNER_NETWORK: ${ASOR_RUNNER_NETWORK:-asor_default}
      ASOR_RUNNER_TIMEOUT_SECONDS: ${ASOR_RUNNER_TIMEOUT_SECONDS:-180}
      ASOR_GEMINI_HOME_VOLUME: ${ASOR_GEMINI_HOME_VOLUME:-asor-gemini-home}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-true}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GEMINI_MODEL: ${GEMINI_MODEL:-flash}
      ASOR_GCLOUD_ADC_PATH: ${ASOR_GCLOUD_ADC_PATH:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy

  web:
    image: asor-web:dev
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      ASOR_API_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  rabbitmq-data:
