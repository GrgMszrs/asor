[project]
name = "asor-core"
version = "0.1.0"
description = "asor domain models and runner interface"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asor_core"]
